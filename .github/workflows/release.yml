name: Release Skin Package

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Skin Resources
        run: npm run build

      - name: Verify ZIP Package Existence
        run: |
          if [ ! -f "dist/tistory-skin-toss-tech.zip" ]; then
            echo "Error: dist/tistory-skin-toss-tech.zip not found!"
            exit 1
          fi

      - name: Verify ZIP Package Is Flat
        run: |
          if unzip -Z1 dist/tistory-skin-toss-tech.zip | grep -q '/'; then
            echo "Error: release zip must not contain nested paths."
            unzip -Z1 dist/tistory-skin-toss-tech.zip
            exit 1
          fi

      - name: Create GitHub Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/tistory-skin-toss-tech.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
